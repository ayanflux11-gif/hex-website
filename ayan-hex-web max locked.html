<style>
:root{--bg:#070b12;--ac:#4cc9f0;--line:rgba(120,190,255,.2);--tx:#dbe6f3;--mut:#7f93ab;--bad:#f07a7a}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.6 'JetBrains Mono',ui-monospace,Consolas,monospace;min-height:100vh;display:grid;place-items:center;padding:20px;overflow:hidden;transition:opacity .7s}
body.out{opacity:0}
body:before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(76,201,240,.05) 0 1px,transparent 1px 48px);pointer-events:none}
body:after{content:"";position:fixed;left:0;right:0;height:120px;top:-120px;background:linear-gradient(transparent,rgba(76,201,240,.08),transparent);animation:sc 6s linear infinite;pointer-events:none}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
main{position:relative;width:min(400px,100%);border:1px solid var(--line);padding:28px 24px;background:rgba(16,24,38,.75);border-radius:6px}
main:before,main:after{content:"";position:absolute;width:12px;height:12px;border:1px solid var(--ac)}
main:before{top:-1px;left:-1px;border-right:0;border-bottom:0}main:after{bottom:-1px;right:-1px;border-left:0;border-top:0}
h1{font:700 34px 'Space Grotesk',system-ui,sans-serif;letter-spacing:.16em}
.s{color:var(--mut);font-size:12px;margin:2px 0 18px}
#t{font-size:12px;color:var(--ac);min-height:66px;white-space:pre-wrap}
label{display:block;font-size:12px;color:var(--mut);margin:14px 0 6px}
input{width:100%;background:transparent;border:1px solid var(--line);border-radius:4px;padding:12px;color:var(--tx);font:16px inherit;letter-spacing:.2em}
input:focus{outline:2px solid var(--ac);outline-offset:1px}
button{margin-top:14px;width:100%;padding:12px;background:var(--ac);color:#04121a;border:0;border-radius:4px;font:600 14px inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
#m{min-height:22px;font-size:13px;margin-top:10px;color:var(--mut)}
.bad{animation:sh .35s}.bad #m{color:var(--bad)}
@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
